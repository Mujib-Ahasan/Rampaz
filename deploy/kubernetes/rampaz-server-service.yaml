apiVersion: v1
kind: Service
metadata:
  name: rampaz-server
  namespace: rampaz
  labels:
    app: rampaz-server
spec:
  type: ClusterIP
  selector:
    app: rampaz-server
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: metrics
      port: 9090
      targetPort: 9090