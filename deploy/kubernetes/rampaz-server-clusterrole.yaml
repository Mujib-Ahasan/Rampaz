apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rampaz-server
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - nodes
      - services
      - namespaces
      - persistentvolumeclaims
      - persistentvolumes
      - events
      - configmaps
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
     - serviceaccounts
    verbs: ["get", "list"]

  - apiGroups: ["networking.k8s.io"]
    resources:
     - networkpolicies
     - ingresses
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]